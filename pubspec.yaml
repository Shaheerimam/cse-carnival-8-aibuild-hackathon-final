name: profmate
description: "Faculty Exam Auditor — AI-powered academic assessment intelligence for university faculty."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # AI
  google_generative_ai: ^0.4.6

  # File handling
  file_picker: ^8.1.6
  path_provider: ^2.1.5

  # PDF extraction
  syncfusion_flutter_pdf: ^28.1.38

  # Local persistence
  shared_preferences: ^2.3.5

  # Charts & Indicators
  fl_chart: ^0.70.2
  percent_indicator: ^4.2.4

  # Animations
  lottie: ^3.3.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

  # Typography
  google_fonts: ^6.2.1

  # Sharing / export
  share_plus: ^10.1.4

  # State management
  provider: ^6.1.5

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
